function fmt(s){const d=d2(s);const w='日一二三四五六'[d.getDay()];return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+w}
function card(e){

  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  const b=document.getElementById('box');const t0=d2(TODAY);let h='';
